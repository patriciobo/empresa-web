# Manifiesto para Promo Studio: describe Fogón para generar su contenido de Instagram.
# Ver github.com/patriciobo/promo-studio (asistente, validación y documentación de cada campo).
# Estrategia completa (pilares, calendario, anuncios): docs/estrategia-redes.md
name: Fogón
url: https://fogonestudio.com.ar
tagline: Tu socio en tecnología e identidad digital, con servicios a medida de cada negocio
description: >-
  Empresa de servicios de tecnología e identidad digital para negocios de cualquier rubro en todo el país. No vende un
  producto, una app ni una plataforma: es un equipo que se suma al del cliente y diseña cada solución a medida de
  ese negocio (marca, sitio web, procesos, sistemas de gestión, tableros de datos y automatizaciones, por ejemplo
  de consultas por WhatsApp). Primero entiende cómo trabaja el negocio y después decide qué conviene hacer.
  Se contrata por una suscripción mensual desde US$ 39 que incluye desarrollo, hosting, soporte y mejoras.
  Trabaja con cualquier rubro; tiene proyectos hechos para negocios de salud, construcción, educación, turismo,
  deporte y medios. Un sistema de información hecho a medida deja registrado cada movimiento del negocio (atenciones,
  gastos, stock, cobros, sueldos) y lo convierte en números para analizar y decidir: rentabilidad del mes, costo
  real por cliente o por obra, desvíos a tiempo. Ordena el trabajo del equipo y queda propiedad del negocio.
category: Servicios de tecnología e identidad digital
audience:
  countries: [AR]
  age: [28, 58]
  interests: [emprendimiento, administración de empresas, gestión empresarial, marketing digital, transformación digital, productividad]
  description: >-
    dueños de negocios de cualquier rubro (servicios, salud, construcción, educación, turismo, comercio) que ya
    venden pero gestionan con WhatsApp, papel y planillas, no saben bien sus números y quieren profesionalizarse
    sin hacer una inversión grande de entrada
languages: [es]
tone: >-
  español rioplatense con voseo; cercano, claro y concreto, como un socio que sabe de tecnología y de negocios;
  sin jerga técnica, sin metáforas ni promesas exageradas, con ejemplos reales del día a día de un negocio.
  Siempre como empresa de servicios que trabaja con cada cliente ("te ayudamos", "diseñamos para tu negocio",
  "nos sumamos a tu equipo"), nunca como un producto o una herramienta que el negocio usa. Cada caso es una
  solución hecha para ese negocio, no algo que cualquiera puede contratar igual.
brand:
  colors: ["#ff5a1f", "#ece6dc", "#0c0b0a", "#7d776e"]
  font: Inter Tight
  logo: .promo/marca/logo.jpg
  imageStyle: >-
    dark editorial still life on a near-black background, warm low orange light, film grain, lots of negative
    space: objects of the business in the post, or a laptop or phone showing an invented simplified app
    screen that matches the topic (chart, form, calendar, dashboard), no readable text, no real brands or logos
  photoStyle: >-
    low-key cinematic photo of a business owner in their own workplace (workshop, clinic, construction site,
    studio) checking a laptop, dark background, warm orange practical light, film grain, Argentina, no visible text
features:
  - Empresa de servicios, no un producto - cada solución se diseña a medida de cada negocio
  - Relevamiento de cómo trabaja el negocio antes de decidir qué hacer
  - Sistemas de gestión a medida de la operación de cada cliente
  - Tableros y resúmenes con los números que cada negocio necesita ver
  - Sitios web a medida con SEO local y preparados para asistentes de IA
  - Diseño de marca e identidad
  - Automatización de consultas, turnos y recordatorios por WhatsApp cuando el negocio lo necesita
  - Suscripción mensual desde US$ 39 con desarrollo, hosting, soporte y mejoras incluidos
  - Autodiagnóstico gratuito de 2 minutos que recomienda el plan que conviene (Presencia, Gestión o Integral)
  - Proceso claro desde el primer contacto - charla inicial sin costo, relevamiento y propuesta, arranque y mejora mensual
  - Trabaja con cualquier rubro; proyectos en uso en salud, construcción, educación, turismo, deporte y medios
  # Beneficios de un sistema de información a medida, con ejemplos de los proyectos (capturas en screenshots)
  - Registro de cada movimiento al momento (atenciones, gastos, cobros, stock, sueldos) para analizarlo después, no anotaciones sueltas
  - Historial que no se pierde - cada atención, obra, horneada o pieza dental queda guardada para consultar y comparar
  - Decisiones con números reales - rentabilidad del mes, costo por alumno, resultado de cada obra, en vez de intuición
  - Desvíos detectados a tiempo - una obra que se pasa del presupuesto se ve durante la obra, no al final
  - Precios calculados con los costos reales (por ejemplo, la cuota de un taller según lo que cuesta cada alumno)
  - Todo el negocio en un mismo lugar - agenda, clientes, stock, gastos y cobros, sin planillas ni mensajes dispersos
  - Menos tiempo administrativo - registrar una atención en menos de 30 segundos, armar los sueldos de la semana en minutos
  - Stock que se descuenta solo y avisa qué reponer
  - Trazabilidad - quién cargó qué y cuándo, con usuarios y permisos para delegar sin perder el control
  - El equipo carga desde el celular donde está trabajando (la obra, el taller, el consultorio)
  - Resúmenes automáticos - el resultado del mes sin hacer cuentas ni pedir informes
  - El sistema se adapta a cómo trabaja el negocio, no el negocio al sistema, y mejora mes a mes con la suscripción
  - El conocimiento queda en el negocio - procesos documentados y datos siempre exportables en formatos abiertos
  - Accesible - sin juntar un monto alto al principio; hosting, backups diarios, soporte y mejoras incluidos en la cuota
