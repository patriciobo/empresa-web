# Manifiesto para Promo Studio: describe Fogón para generar su contenido de Instagram.
# Ver github.com/patriciobo/promo-studio (asistente, validación y documentación de cada campo).
# Estrategia completa (pilares, calendario, anuncios): docs/estrategia-redes.md
#
# Foco: soluciones de negocio para gestionar la información (registrar, organizar, analizar, decidir).
# Los posts NO hablan de proyectos, clientes ni rubros puntuales: por eso no hay screenshots ni fuentes con casos.
name: Fogón
url: https://fogonestudio.com.ar
tagline: Soluciones a medida para que tu negocio registre, organice y entienda su información
description: >-
  Fogón desarrolla soluciones de negocio a medida y acompaña a emprendedores a crecer ayudándolos a gestionar su
  información. Diseña herramientas para registrar cada movimiento del negocio en el momento, tenerlo todo
  organizado en un solo lugar y analizarlo después: resúmenes, indicadores y alertas para decidir con números
  reales en vez de intuición. Es una empresa de servicios, no un producto: primero entiende cómo trabaja cada
  negocio y después diseña lo que conviene (sistemas de gestión, tableros, procesos, automatizaciones, sitio web y
  marca). Se contrata por una suscripción mensual desde US$ 39 que incluye desarrollo, hosting, backups, soporte y
  mejoras, así que no hace falta juntar un monto alto para empezar. Los datos son siempre del negocio.
category: Desarrollo de soluciones de negocio y gestión de la información
audience:
  countries: [AR]
  age: [28, 58]
  interests: [emprendimiento, administración de empresas, gestión empresarial, transformación digital, productividad, análisis de datos]
  description: >-
    emprendedores y dueños de negocios que ya venden pero llevan la información en papel, planillas y mensajes,
    no saben bien sus números y quieren ordenarse y crecer tomando decisiones con datos, sin una inversión
    grande de entrada
languages: [es]
tone: >-
  español rioplatense con voseo; cercano, claro y concreto, como un socio que sabe de tecnología y de negocios;
  sin jerga técnica, sin metáforas ni promesas exageradas. Habla de situaciones que cualquier negocio reconoce
  (no saber cuánto ganó el mes, datos repartidos en planillas y chats, tiempo perdido en tareas administrativas)
  sin nombrar rubros ni casos. Siempre como empresa de servicios que acompaña ("te ayudamos", "diseñamos para tu
  negocio", "nos sumamos a tu equipo"), nunca como un producto o una herramienta que el negocio usa.
brand:
  colors: ["#ff5a1f", "#ece6dc", "#0c0b0a", "#7d776e"]
  font: Inter Tight
  logo: .promo/marca/logo.jpg
  imageStyle: >-
    dark editorial still life on a near-black background, warm low orange light, film grain, lots of negative
    space: a laptop, phone, notebook or desk objects, or a screen showing an invented simplified interface that
    matches the topic (chart, table, form, dashboard), no tools or objects of any specific trade, no readable
    text, no real brands or logos
  photoStyle: >-
    low-key cinematic photo of an entrepreneur at a desk reviewing charts on a laptop, neutral office or home
    workspace with no signs of a specific trade, dark background, warm orange practical light, film grain,
    Argentina, no visible text
features:
  - Empresa de servicios, no un producto - cada solución se diseña a medida de cada negocio
  - Relevamiento de cómo trabaja el negocio antes de decidir qué desarrollar
  - Registro de cada movimiento en el momento (ventas, gastos, cobros, stock) para analizarlo después
  - Toda la información del negocio en un solo lugar, en vez de papel, planillas y mensajes dispersos
  - Historial que no se pierde - cada cliente, pedido o trabajo queda guardado para consultar y comparar
  - Decisiones con números reales - resultado del mes, costos y rentabilidad sin hacer cuentas
  - Precios calculados con los costos reales del negocio
  - Alertas a tiempo - presupuesto excedido, stock bajo, cobros vencidos
  - Resumen mensual automático e indicadores con los números que cada negocio necesita ver
  - Menos tiempo administrativo - carga rápida desde el celular, tareas repetidas simplificadas o automatizadas
  - Usuarios, permisos y registro de actividad - delegar sin perder el control, sabiendo quién hizo qué y cuándo
  - El conocimiento queda en el negocio - procesos documentados y datos siempre exportables en formatos abiertos
  - La solución se adapta a cómo trabaja el negocio y mejora todos los meses con la suscripción
  - Suscripción mensual desde US$ 39 con desarrollo, hosting, backups diarios, soporte y mejoras incluidos
  - Sitios web a medida con SEO local y preparados para asistentes de IA, y diseño de marca e identidad
  - Automatización de consultas y recordatorios por WhatsApp cuando el negocio lo necesita
  - Autodiagnóstico gratuito de 2 minutos que recomienda el plan que conviene (Presencia, Gestión o Integral)
  - Proceso claro desde el primer contacto - charla inicial sin costo, relevamiento y propuesta, arranque y mejora mensual
pillars: [información para decidir, orden y procesos, herramientas a medida, crecer acompañado, marca y presencia online]
hashtags: ["#fogonestudio", "#emprendedores", "#emprendedoresargentinos", "#gestiondenegocios", "#transformaciondigital", "#software", "#datos"]
avoid:
  - mencionar proyectos, clientes, casos de éxito o nombres de negocios (ni reales ni inventados)
  - nombrar o apuntar el texto a un rubro o sector en particular (salud, consultorios, odontología, construcción, obras, talleres, cerámica, turismo, alojamientos, comercios, gastronomía, etc.); hablar de negocios en general
  - ejemplos atados a un oficio (pacientes, turnos médicos, obras, materiales de construcción, alumnos, huéspedes, recetas); usar ejemplos que sirven a cualquier negocio (ventas, gastos, cobros, stock, clientes, pedidos)
  - usar imágenes o capturas del sitio de Fogón o de sistemas reales; si hace falta mostrar una pantalla, que sea una interfaz inventada e ilustrativa sin presentarla como real
  - presentar a Fogón como una plataforma, app, software o producto que se compra, se descarga, se instala o se prueba; es una empresa de servicios que diseña cada solución a medida
  - frases que hagan de Fogón una herramienta - "así se ordena con Fogón", "con Fogón tenés…", "Fogón te permite…", "usá Fogón", "probá Fogón", "registrate", "descargá"
  - prometer funciones o formatos fijos (que funciona sin instalar nada, que es una app en el celular, que es autoadministrable, un módulo para tu rubro); dependen de cada solución
  - presentar a Fogón como una empresa de Córdoba o local; trabaja con negocios de todo el país
  - mencionar el tamaño de los negocios a los que apunta (pymes, negocios chicos, pequeñas empresas, cantidad de empleados, "no es solo para empresas grandes")
  - inventar testimonios, reseñas, logos o cifras de resultados
  - prometer aumentos de ventas, ganancias o resultados garantizados
  - mencionar precios, descuentos o promociones que no estén en el sitio (sólo "desde US$ 39 por mes" y "desde US$ 89 por mes")
  - ofrecer diagnósticos, auditorías o propuestas gratis (gratis es sólo la charla inicial y el autodiagnóstico online)
  - decir que los mensajes de WhatsApp Business no tienen costo (Meta los cobra aparte)
  - criticar o nombrar a la competencia, a otros programas o a contadores
  - dar asesoramiento contable, impositivo o legal
  - jerga técnica (frameworks, lenguajes, bases de datos) en lugar de beneficios para el negocio
cta: Hacé el autodiagnóstico y descubrí qué plan te conviene (link en la bio)
